<!doctype html>
<html lang="en" data-resolution="portrait" data-composition-variables='[
  {"id":"quote","type":"string","label":"Quote","default":"Ship the small thing today. Polish it tomorrow."},
  {"id":"highlight","type":"string","label":"Word to highlight","default":"today."},
  {"id":"author","type":"string","label":"Author","default":"Mina Okafor"},
  {"id":"role","type":"string","label":"Role / source","default":"Founder, Paperplane"},
  {"id":"accent","type":"color","label":"Accent","default":"#FF5C39"},
  {"id":"bg","type":"color","label":"Background","default":"#F4EFE6"},
  {"id":"ink","type":"color","label":"Text color","default":"#161616"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 720px; height: 1280px; overflow: hidden; background: #f4efe6; }
      #root { position: relative; width: 720px; height: 1280px; overflow: hidden; background: var(--bg); color: var(--ink);
        font-family: "Playfair Display", Georgia, serif; }
      .clip { position: absolute; inset: 0; }
      #mark { position: absolute; inset: auto; left: 60px; top: 150px; font-size: 300px; line-height: 1; color: var(--accent); opacity: 0; font-weight: 900; }
      #quote { position: absolute; inset: auto; left: 64px; right: 64px; top: 380px; font-size: 76px; line-height: 1.12; font-weight: 700; letter-spacing: -0.01em; }
      #quote .w { display: inline-block; margin-right: 0.24em; opacity: 0; position: relative; }
      #quote .hl { color: var(--accent); }
      #quote .hl::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0.06em; height: 0.12em; background: var(--accent);
        transform-origin: left center; transform: scaleX(var(--u, 0)); }
      #attr { position: absolute; inset: auto; left: 64px; bottom: 170px; display: flex; align-items: center; gap: 22px; opacity: 0; font-family: "Inter", sans-serif; }
      #bar { width: 64px; height: 6px; background: var(--accent); }
      #author { font-size: 34px; font-weight: 700; }
      #role { font-size: 26px; opacity: .7; margin-top: 4px; }
      #wipe { background: var(--accent); transform-origin: bottom center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="720" data-height="1280">
      <div id="wipe" class="clip" data-start="0" data-duration="0.8" data-track-index="0"></div>
      <div id="mark" class="clip" data-start="0.3" data-duration="7.7" data-track-index="1">&ldquo;</div>
      <div id="quote" class="clip" data-start="0.4" data-duration="7.6" data-track-index="2"></div>
      <div id="attr" class="clip" data-start="0.4" data-duration="7.6" data-track-index="3">
        <div id="bar"></div><div><div id="author"></div><div id="role"></div></div>
      </div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const root = document.getElementById("root");
      root.style.setProperty("--accent", v.accent); root.style.setProperty("--bg", v.bg); root.style.setProperty("--ink", v.ink);
      const words = v.quote.split(/\s+/).filter(Boolean);
      const hl = (v.highlight || "").trim().toLowerCase();
      document.getElementById("quote").innerHTML = words
        .map((w) => `<span class="w${w.toLowerCase() === hl ? " hl" : ""}">${w.replace(/</g, "&lt;")}</span>`).join(" ");
      document.getElementById("author").textContent = v.author;
      document.getElementById("role").textContent = v.role;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#wipe", { scaleY: 1 }, { scaleY: 0, duration: 0.7, ease: "power3.inOut" }, 0);
      tl.fromTo("#mark", { opacity: 0, y: 40, rotation: -10 }, { opacity: 0.9, y: 0, rotation: 0, duration: 0.6, ease: "back.out(1.6)" }, 0.45);
      const per = Math.min(0.32, 3.6 / Math.max(words.length, 1));
      tl.fromTo("#quote .w", { opacity: 0, y: 46, rotation: 4, scale: 0.9 },
        { opacity: 1, y: 0, rotation: 0, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: per }, 0.8);
      const endWords = 0.8 + per * words.length + 0.3;
      tl.fromTo("#quote .hl", { "--u": 0 }, { "--u": 1, duration: 0.5, ease: "power2.out" }, endWords);
      tl.fromTo("#quote .hl", { scale: 1 }, { scale: 1.08, duration: 0.2, yoyo: true, repeat: 1, ease: "power1.inOut" }, endWords);
      tl.fromTo("#attr", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, endWords + 0.5);
      tl.fromTo("#quote", { y: 0 }, { y: -14, duration: 8, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
