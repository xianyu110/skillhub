<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[
  {"id":"product","type":"string","label":"Product","default":"Driftboard"},
  {"id":"beforeLabel","type":"string","label":"Before label","default":"Before: 9 tabs of raw logs"},
  {"id":"afterLabel","type":"string","label":"After label","default":"After: one live dashboard"},
  {"id":"headline","type":"string","label":"Headline","default":"From noise to signal in 30 seconds"},
  {"id":"m1","type":"string","label":"After metric 1","default":"Error rate 0.4%"},
  {"id":"m2","type":"string","label":"After metric 2","default":"p95 182 ms"},
  {"id":"m3","type":"string","label":"After metric 3","default":"Deploys 14 today"},
  {"id":"accent","type":"color","label":"Accent","default":"#5B8CFF"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #111; }
      #root { position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: "Inter", sans-serif; }
      .clip { position: absolute; inset: 0; }
      #before { background: #e9e6df; padding: 60px; }
      .sheet { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; transform: rotate(-1.2deg); }
      .cell { height: 34px; background: #fff; border: 1px solid #cfcac0; font-family: "JetBrains Mono", monospace; font-size: 13px; color: #6b665e; padding: 8px 6px; overflow: hidden; white-space: nowrap; }
      .cell.bad { background: #ffd9d2; color: #a3321f; }
      #afterWrap { overflow: hidden; width: 0; right: auto; }
      #after { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; background: #0e1320; padding: 70px; color: #eaf0ff; }
      .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 110px; }
      .tile { height: 190px; border-radius: 22px; background: #172036; border: 1px solid #26314d; padding: 26px; display: flex; flex-direction: column; justify-content: space-between; }
      .tile b { font-family: "Outfit", sans-serif; font-size: 34px; }
      .spark { height: 64px; display: flex; align-items: flex-end; gap: 7px; }
      .spark i { flex: 1; background: var(--accent); border-radius: 4px; opacity: .85; }
      #divider { width: 6px; left: 0; right: auto; background: #fff; box-shadow: 0 0 30px rgba(255,255,255,.8); }
      .tag { position: absolute; top: 34px; padding: 12px 22px; border-radius: 999px; font-size: 24px; font-weight: 700; opacity: 0; }
      #tagB { left: 40px; background: #1c1c1c; color: #fff; }
      #tagA { right: 40px; background: var(--accent); color: #fff; }
      #end { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(8,10,18,.82); color: #fff; opacity: 0; }
      #endP { font-family: "Outfit", sans-serif; font-weight: 700; font-size: 92px; letter-spacing: -0.04em; }
      #endH { font-size: 36px; color: #cfd8ef; }
      #endBar { width: 120px; height: 8px; border-radius: 4px; background: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1280" data-height="720">
      <div id="before" class="clip" data-start="0" data-duration="10" data-track-index="0"><div class="sheet" id="sheet"></div></div>
      <div id="afterWrap" class="clip" data-start="0" data-duration="10" data-track-index="1">
        <div id="after"><div class="tiles" id="tiles"></div></div>
      </div>
      <div id="divider" class="clip" data-start="1.6" data-duration="4.2" data-track-index="2"></div>
      <div id="tagB" class="tag" data-start="0" data-duration="10" data-track-index="3"></div>
      <div id="tagA" class="tag" data-start="0" data-duration="10" data-track-index="4"></div>
      <div id="end" class="clip" data-start="6.6" data-duration="3.4" data-track-index="5"><div id="endP"></div><div id="endBar"></div><div id="endH"></div></div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const root = document.getElementById("root");
      root.style.setProperty("--accent", v.accent);
      // Deterministic "messy" sheet (fixed pattern, no Math.random()).
      const words = ["ERR 502", "timeout", "GET /api", "retry=3", "null", "WARN", "ts=1729", "500", "user_id", "OOM?", "p99 2.4s", "??"];
      document.getElementById("sheet").innerHTML = Array.from({ length: 8 * 15 }, (_, i) =>
        `<div class="cell${(i * 7) % 11 === 3 || (i * 5) % 13 === 1 ? " bad" : ""}">${words[(i * 5 + (i >> 3)) % words.length]}</div>`).join("");
      const bars = (seed) => Array.from({ length: 14 }, (_, k) => `<i style="height:${20 + ((k * seed * 37) % 80)}%"></i>`).join("");
      document.getElementById("tiles").innerHTML = [v.m1, v.m2, v.m3]
        .map((m, i) => `<div class="tile"><b>${m}</b><div class="spark">${bars(i + 3)}</div></div>`).join("");
      document.getElementById("tagB").textContent = v.beforeLabel;
      document.getElementById("tagA").textContent = v.afterLabel;
      document.getElementById("endP").textContent = v.product;
      document.getElementById("endH").textContent = v.headline;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#tagB", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4 }, 0.3);
      tl.fromTo(".sheet", { scale: 1.04 }, { scale: 1, duration: 1.6, ease: "power1.out" }, 0);
      tl.fromTo("#afterWrap", { width: 0 }, { width: 1280, duration: 3.6, ease: "power2.inOut" }, 1.8);
      tl.fromTo("#divider", { x: 0 }, { x: 1274, duration: 3.6, ease: "power2.inOut" }, 1.8);
      tl.to("#tagB", { opacity: 0, duration: 0.3 }, 4.2);
      tl.fromTo("#tagA", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4 }, 4.6);
      tl.fromTo(".tile", { y: 30, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.5, stagger: 0.12, ease: "power2.out" }, 4.4);
      tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 6.6);
      tl.fromTo("#endP", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 6.75);
      tl.fromTo("#endBar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 7.1);
      tl.fromTo("#endH", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5 }, 7.3);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
