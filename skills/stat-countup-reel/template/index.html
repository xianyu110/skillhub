<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Orbit, one year in"},
  {"id":"s1","type":"string","label":"Stat 1 value","default":"12,480"},
  {"id":"l1","type":"string","label":"Stat 1 label","default":"teams on board"},
  {"id":"s2","type":"string","label":"Stat 2 value","default":"99.98%"},
  {"id":"l2","type":"string","label":"Stat 2 label","default":"uptime"},
  {"id":"s3","type":"string","label":"Stat 3 value","default":"4.9/5"},
  {"id":"l3","type":"string","label":"Stat 3 label","default":"average rating"},
  {"id":"footer","type":"string","label":"Footer","default":"orbit.app · thank you"},
  {"id":"accent","type":"color","label":"Accent","default":"#7C5CFF"},
  {"id":"bg","type":"color","label":"Background","default":"#F7F7FB"},
  {"id":"ink","type":"color","label":"Text","default":"#11111A"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #f7f7fb; }
      #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Inter", sans-serif; }
      .clip { position: absolute; inset: 0; }
      #title { position: absolute; inset: auto; left: 90px; top: 70px; font-family: "Outfit", sans-serif; font-weight: 700; font-size: 60px; letter-spacing: -0.03em; opacity: 0; }
      #rule { position: absolute; inset: auto; left: 90px; top: 160px; width: 1100px; height: 3px; background: var(--ink); opacity: .12; transform-origin: left; }
      .stat { position: absolute; inset: auto; top: 240px; width: 350px; }
      #st1 { left: 90px; } #st2 { left: 470px; } #st3 { left: 850px; }
      .val { display: flex; height: 100px; overflow: hidden; font-family: "Outfit", sans-serif; font-weight: 700; font-size: 84px; line-height: 100px; letter-spacing: -0.02em; }
      .col { align-items: center; }
      .col { display: flex; flex-direction: column; }
      .col span, .ch { display: block; height: 100px; }
      .col span { text-align: center; white-space: nowrap; }
      .lab { font-size: 28px; opacity: .65; margin-top: 14px; }
      .track { margin-top: 26px; height: 14px; border-radius: 7px; background: rgba(0,0,0,.07); overflow: hidden; }
      .fill { height: 100%; width: 100%; border-radius: 7px; background: var(--accent); transform-origin: left; transform: scaleX(0); }
      #footer { position: absolute; inset: auto; left: 90px; bottom: 70px; font-family: "JetBrains Mono", monospace; font-size: 24px; opacity: 0; }
      #dot { position: absolute; inset: auto; right: 90px; bottom: 64px; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1280" data-height="720">
      <div id="title" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>
      <div id="rule" class="clip" data-start="0" data-duration="10" data-track-index="1"></div>
      <div id="st1" class="stat clip" data-start="0.8" data-duration="9.2" data-track-index="2"><div class="val"></div><div class="lab"></div><div class="track"><div class="fill"></div></div></div>
      <div id="st2" class="stat clip" data-start="1.6" data-duration="8.4" data-track-index="3"><div class="val"></div><div class="lab"></div><div class="track"><div class="fill"></div></div></div>
      <div id="st3" class="stat clip" data-start="2.4" data-duration="7.6" data-track-index="4"><div class="val"></div><div class="lab"></div><div class="track"><div class="fill"></div></div></div>
      <div id="footer" class="clip" data-start="0" data-duration="10" data-track-index="5"></div>
      <div id="dot" class="clip" data-start="0" data-duration="10" data-track-index="6"></div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const root = document.getElementById("root");
      ["accent", "bg", "ink"].forEach((k) => root.style.setProperty('--' + k, v[k]));
      document.getElementById("title").textContent = v.title;
      document.getElementById("footer").textContent = v.footer;
      // Odometer: every digit is a column of 0-9 repeated 3x; tween y to the target row (seek-safe, no textContent updates).
      const CYCLES = 2;
      // Each column is as wide as its FINAL digit (Outfit 700 advance widths, em), so a settled "1"
      // sits tight against its neighbours instead of floating in a tabular cell.
      const W = { 0: 0.65, 1: 0.36, 2: 0.54, 3: 0.54, 4: 0.59, 5: 0.54, 6: 0.55, 7: 0.51, 8: 0.54, 9: 0.55 };
      const build = (el, value) => {
        el.innerHTML = [...value].map((c) => /\d/.test(c)
          ? `<div class="col" data-d="${c}" style="width:${W[c]}em">${Array.from({ length: (CYCLES + 1) * 10 }, (_, i) => `<span>${i % 10}</span>`).join("")}</div>`
          : `<span class="ch">${c}</span>`).join("");
      };
      [1, 2, 3].forEach((i) => {
        build(document.querySelector('#st' + i + ' .val'), v['s' + i]);
        document.querySelector('#st' + i + ' .lab').textContent = v['l' + i];
      });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, 0.3);
      [[1, 0.8], [2, 1.6], [3, 2.4]].forEach(([i, t]) => {
        const st = '#st' + i;
        tl.fromTo(st, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
        document.querySelectorAll(st + ' .col').forEach((col, k, all) => {
          const target = CYCLES * 10 + Number(col.dataset.d);
          tl.fromTo(col, { y: 0 }, { y: -100 * target, duration: 1.8 + (all.length - k) * 0.12, ease: "power3.out" }, t + 0.1);
        });
        tl.fromTo(st + ' .fill', { scaleX: 0 }, { scaleX: 0.55 + i * 0.13, duration: 1.6, ease: "power2.out" }, t + 0.2);
      });
      tl.to(".stat", { y: -8, duration: 0.3, stagger: 0.1, ease: "power1.out" }, 5.2);
      tl.to(".stat", { y: 0, duration: 0.4, stagger: 0.1, ease: "power1.in" }, 5.5);
      tl.fromTo("#footer", { opacity: 0 }, { opacity: 0.8, duration: 0.5 }, 6.2);
      tl.fromTo("#dot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(3)" }, 6.4);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
